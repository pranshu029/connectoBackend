spring.application.name=connectobackend

# ===============================
# Application
# ===============================
application.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8081

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/connectobackend_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Hibernate Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JWT Configuration
# ===============================
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.access-token-expiration=900000
application.security.jwt.refresh-token-expiration=604800000

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.connectobackend=DEBUG

# ===============================
# Mail Service
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# OTP Configuration
# ===============================
otp.expiration-minutes=5
otp.registration-token-expiration-minutes=10
otp.max-attempts=5
otp.resend-cooldown-seconds=60
otp.max-sends-per-day=10