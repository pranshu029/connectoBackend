spring.application.name=connectoBackend

# ===============================
# Application
# ===============================
spring.application.name=connecto-backend
application.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/connectobackend_db
spring.datasource.username=root
spring.datasource.password=Pranshumysql@29
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Hibernate Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ===============================
# JWT Configuration
# ===============================
application.security.jwt.secret-key=ReplaceThisWithAVeryLongRandomSecretKeyOfAtLeast256BitsForHS256Algorithm
application.security.jwt.access-token-expiration=900000
application.security.jwt.refresh-token-expiration=604800000

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.connectobackend=DEBUG
text=auto
